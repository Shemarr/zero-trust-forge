<svg viewBox="0 0 224 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zero Trust Forge">
  <defs>
    <!-- Shield + lock gradient: cyan top-left → purple bottom-right -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Wordmark gradient: cyan → purple, horizontal -->
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- ── SHIELD (outline) ── -->
  <path d="M33 3 L60 14 L60 43 C60 56 48 65 33 70 C18 65 6 56 6 43 L6 14 Z"
        fill="#0d1220" stroke="url(#shieldGrad)" stroke-width="3"/>

  <!-- ── LOCK ── -->
  <path d="M25 34 v-6 a8 8 0 0 1 16 0 v6"
        fill="none" stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="21" y="34" width="24" height="18" rx="4" fill="url(#shieldGrad)"/>
  <circle cx="33" cy="41" r="2.6" fill="#0d1220"/>
  <rect x="31.7" y="41" width="2.6" height="6" rx="1.3" fill="#0d1220"/>

  <!-- ── WORDMARK ── -->
  <!-- "ZERO TRUST" — small caps label -->
  <text x="79" y="29"
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10" font-weight="600" letter-spacing="0.22em"
        fill="#8896b3">ZERO TRUST</text>

  <!-- "FORGE" — large gradient display word -->
  <text x="77" y="61"
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="33" font-weight="800" letter-spacing="-0.025em"
        fill="url(#wordGrad)">FORGE</text>
</svg>
